name: 1) تفريغ تسجيل

# التشغيل من أي مكان: افتح المستودع من المتصفح أو الموبايل ->
# Actions -> "تفريغ تسجيل" -> Run workflow -> الصق رابط التسجيل.
# لا تحتاج تثبيت أي شيء على أي جهاز.

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "رابط التسجيل (Google Drive / Dropbox / أي رابط مباشر). اتركه فاضي لو رفعت الملف في مجلد inbox"
        required: false
        default: ""
      provider:
        description: "محرك التفريغ"
        required: true
        default: "qwencleo"
        type: choice
        options:
          - qwencleo     # مدرَّب على المصري تحديدًا -- مفتوح ومجاني، الأدق بين المفتوحات
          - elevenlabs   # الأدق المقاس مستقلًا على المصري (13.1% WER) -- مدفوع
          - gemini       # قوي ويفهم السياق -- الطبقة المجانية تُستخدم في تحسين منتجات Google
          - groq         # سريع جدًا ومجاني -- دقته على العامية أقل
          - local        # Whisper عام -- الأضعف على العامية، لكن بلا مفاتيح
      speakers:
        description: "عدد المتحدثين: 1 لتسجيل شخصي، 2 لمكالمة"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4"]
      title:
        description: "عنوان وصفي للتسجيل (اختياري)"
        required: false
        default: ""
      hints:
        description: "أسماء ومصطلحات تُكتب برسم محدد، مفصولة بفاصلة (اختياري)"
        required: false
        default: ""

  # أي ملف صوت تدفعه إلى مجلد inbox يُفرّغ تلقائيًا
  push:
    paths:
      - "inbox/**"

permissions:
  contents: write

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # الحد المجاني لوظيفة واحدة 6 ساعات

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ffmpeg مثبت مسبقًا على runners أوبنتو -- نتحقق فقط
      - name: التحقق من ffmpeg
        run: ffmpeg -hide_banner -version | head -1

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet requests
          case "${{ inputs.provider || 'qwencleo' }}" in
            local)
              pip install --quiet faster-whisper
              ;;
            qwencleo)
              # runners المجانية بلا GPU، فنثبّت torch نسخة المعالج.
              # تنبيه: على المعالج هذا المحرك أبطأ من الزمن الحقيقي --
              # للتسجيلات الطويلة استخدم Colab بـ GPU مجاني أو EC2 spot.
              pip install --quiet torch torchaudio \
                --index-url https://download.pytorch.org/whl/cpu
              pip install --quiet qwencleo-asr --no-deps
              pip install --quiet "qwen-asr>=0.0.6" numpy soundfile huggingface_hub
              ;;
          esac

      - name: استرجاع أوزان الموديل من الذاكرة المؤقتة
        if: ${{ contains(fromJSON('["local","qwencleo"]'), inputs.provider || 'qwencleo') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: weights-${{ inputs.provider || 'qwencleo' }}

      - name: تنزيل التسجيل من الرابط
        if: ${{ inputs.audio_url != '' }}
        run: python fetch_audio.py "${{ inputs.audio_url }}" --out inbox

      - name: التأكد من وجود ملفات
        id: check
        run: |
          mkdir -p inbox
          count=$(find inbox -maxdepth 1 -type f \
            ! -name '.gitkeep' ! -name 'README*' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "### لا يوجد أي تسجيل للتفريغ" >> "$GITHUB_STEP_SUMMARY"
            echo "الصق رابطًا في خانة \`audio_url\`، أو ارفع ملفًا في مجلد \`inbox\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: التفريغ
        if: steps.check.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          WHISPER_SIZE: large-v3
        run: |
          python transcribe.py inbox \
            --provider "${{ inputs.provider || 'qwencleo' }}" \
            --speakers "${{ inputs.speakers || '1' }}" \
            --title "${{ inputs.title }}" \
            --hints "${{ inputs.hints }}" \
            --out journal

      - name: ملخص النتيجة
        if: steps.check.outputs.count != '0'
        run: |
          echo "## تم التفريغ" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python summarize.py journal >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'الملفات محفوظة في مجلد `journal/`. للمناقشة: شغّل workflow "ناقش الأرشيف".' \
            >> "$GITHUB_STEP_SUMMARY"

      # الصوت الخام لا يُحفظ في المستودع: يكبّر حجمه للأبد وهو غير لازم بعد التفريغ
      - name: تنظيف مجلد inbox
        if: always()
        run: |
          find inbox -maxdepth 1 -type f ! -name '.gitkeep' -delete 2>/dev/null || true
          rm -rf journal/.work 2>/dev/null || true

      - name: حفظ التفريغ في المستودع
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name  "transcribe-bot"
          git config user.email "actions@github.com"
          git add -A journal inbox
          if git diff --cached --quiet; then
            echo "لا جديد للحفظ"
          else
            git commit -m "تفريغ: $(date +%Y-%m-%d\ %H:%M)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: إتاحة الملفات للتنزيل
        if: steps.check.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ github.run_number }}
          path: |
            journal/*.md
            journal/*.txt
            journal/*.srt
            journal/*.json
          retention-days: 30
          if-no-files-found: warn
